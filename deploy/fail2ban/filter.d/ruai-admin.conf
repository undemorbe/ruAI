# /etc/fail2ban/filter.d/ruai-admin.conf
# Строки сервера админки: 2026-11-14T12:00:00.000Z ADMIN_AUTH_FAIL ip=203.0.113.7
# Проверка: fail2ban-regex /var/log/ruai-admin/auth.log /etc/fail2ban/filter.d/ruai-admin.conf

[Definition]
failregex = ^\s*ADMIN_AUTH_FAIL ip=<ADDR>\s*$
ignoreregex =
datepattern = {^LN-BEG}%%Y-%%m-%%dT%%H:%%M:%%S(?:\.%%f)?%%z
