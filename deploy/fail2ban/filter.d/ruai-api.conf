# /etc/fail2ban/filter.d/ruai-api.conf
# Строки API сайта: 2026-11-16T12:00:00.000Z API_AUTH_FAIL ip=203.0.113.7 (неверный код из письма, перебор)
# Проверка: fail2ban-regex /var/log/ruai-api/auth.log /etc/fail2ban/filter.d/ruai-api.conf

[Definition]
failregex = ^\s*API_AUTH_FAIL ip=<ADDR>\s*$
ignoreregex =
datepattern = {^LN-BEG}%%Y-%%m-%%dT%%H:%%M:%%S(?:\.%%f)?%%z
