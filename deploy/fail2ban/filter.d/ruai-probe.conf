# /etc/fail2ban/filter.d/ruai-probe.conf
# В /var/log/nginx/ruai-probe.log пишутся только обращения к ловушкам (/wp-admin, /phpmyadmin, /admin …),
# поэтому каждая строка — попытка поиска админки.
# Проверка: fail2ban-regex /var/log/nginx/ruai-probe.log /etc/fail2ban/filter.d/ruai-probe.conf

[Definition]
failregex = ^<HOST> \S+ \S+ \[
ignoreregex =
