# /etc/nginx/sites-available/ruai.conf — временный, до выпуска сертификата:
# только HTTP, отдаёт ACME-проверку. После certbot заменяется на ruai.conf.
server {
    listen 80;
    listen [::]:80;
    server_name ru-chatgpt.com www.ru-chatgpt.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 404; }
}
