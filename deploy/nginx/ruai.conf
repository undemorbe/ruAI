# /etc/nginx/sites-available/ruai.conf
# Публичный сайт + админка по секретному пути (её location — в snippets/ruai-admin.conf,
# который собирает deploy/server-apply.sh из шаблона). Домен: ru-chatgpt.com, www → без www.

# Зоны ограничения частоты (контекст http).
limit_req_zone  $binary_remote_addr zone=ruai_admin_login:10m rate=6r/m;
limit_req_zone  $binary_remote_addr zone=ruai_admin_api:10m   rate=10r/s;
limit_conn_zone $binary_remote_addr zone=ruai_admin_conn:10m;
limit_req_status  429;
limit_conn_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name ru-chatgpt.com www.ru-chatgpt.com;

    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://ru-chatgpt.com$request_uri; }
}

# www → без www (сертификат покрывает оба имени)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.ru-chatgpt.com;
    ssl_certificate     /etc/letsencrypt/live/ru-chatgpt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ru-chatgpt.com/privkey.pem;
    server_tokens off;
    return 301 https://ru-chatgpt.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ru-chatgpt.com;

    ssl_certificate     /etc/letsencrypt/live/ru-chatgpt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ru-chatgpt.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:ruai_ssl:10m;
    ssl_session_tickets off;

    server_tokens off;
    include /etc/nginx/snippets/ruai-security-headers.conf;

    root /var/www/ruai/dist;
    index index.html;
    client_max_body_size 12m;   # загрузка фото в чат (до 10 МБ)

    # Ловушки: стандартные адреса админок не существуют. Отдельный лог читает fail2ban (jail ruai-probe).
    location ~* ^/(admin|administrator|adminer|wp-admin|wp-login\.php|phpmyadmin|pma|dashboard|cpanel|api/admin)(/|$) {
        access_log /var/log/nginx/ruai-probe.log;
        return 404;
    }
    location ~ /\.(?!well-known/) { return 404; }

    # Публичный API сайта (чат, оплата) — когда появится бэкенд.
    # location /api/ {
    #     proxy_pass http://127.0.0.1:8080;
    #     include /etc/nginx/snippets/ruai-proxy.conf;
    #     proxy_buffering off;   # SSE-стрим ответа
    # }

    # Админка: секретный путь, неизвестный снаружи.
    include /etc/nginx/snippets/ruai-admin.conf;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/ruai-security-headers.conf;
        try_files $uri =404;
    }

    # SPA: любой другой путь — index.html. Неверный «секретный» путь выглядит так же, как любой адрес сайта.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
