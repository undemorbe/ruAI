# /etc/nginx/sites-available/ruai.conf
# Публичный сайт + админка по секретному пути (её location — в snippets/ruai-admin.conf,
# который собирает deploy/server-apply.sh из шаблона). Домен: ru-chatgpt.com, www → без www.

# Зоны ограничения частоты (контекст http).
limit_req_zone  $binary_remote_addr zone=ruai_admin_login:10m rate=6r/m;
limit_req_zone  $binary_remote_addr zone=ruai_admin_api:10m   rate=10r/s;
limit_conn_zone $binary_remote_addr zone=ruai_admin_conn:10m;
# API сайта: общий поток, запрос кода (письма) и проверка кода
limit_req_zone  $binary_remote_addr zone=ruai_api:10m       rate=10r/s;
limit_req_zone  $binary_remote_addr zone=ruai_api_code:10m  rate=6r/m;
limit_req_zone  $binary_remote_addr zone=ruai_api_check:10m rate=40r/m;
limit_req_zone  $binary_remote_addr zone=ruai_api_send:10m  rate=10r/m;
limit_conn_zone $binary_remote_addr zone=ruai_api_conn:10m;
limit_req_status  429;
limit_conn_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name ru-chatgpt.com www.ru-chatgpt.com;

    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://ru-chatgpt.com$request_uri; }
}

# www → без www (сертификат покрывает оба имени)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.ru-chatgpt.com;
    ssl_certificate     /etc/letsencrypt/live/ru-chatgpt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ru-chatgpt.com/privkey.pem;
    server_tokens off;
    return 301 https://ru-chatgpt.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ru-chatgpt.com;

    ssl_certificate     /etc/letsencrypt/live/ru-chatgpt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ru-chatgpt.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:ruai_ssl:10m;
    ssl_session_tickets off;

    server_tokens off;
    include /etc/nginx/snippets/ruai-security-headers.conf;

    root /var/www/ruai/dist;
    index index.html;
    client_max_body_size 12m;   # загрузка фото в чат (до 10 МБ)

    # Сжатие статики (скорость загрузки учитывают Яндекс и Google). В nginx.conf Ubuntu gzip сжимает
    # только text/html. JSON API не сжимаем: в ответах есть ввод пользователя рядом с данными аккаунта (BREACH).
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/manifest+json application/xml text/xml;

    # Неизвестный адрес - код 404 и страница dist/404.html (noindex), а не копия главной с кодом 200.
    error_page 404 /404.html;
    location = /404.html { internal; }

    # Ловушки: стандартные адреса админок не существуют. Отдельный лог читает fail2ban (jail ruai-probe).
    location ~* ^/(admin|administrator|adminer|wp-admin|wp-login\.php|phpmyadmin|pma|dashboard|cpanel|api/admin)(/|$) {
        access_log /var/log/nginx/ruai-probe.log;
        return 404;
    }
    location ~ /\.(?!well-known/) { return 404; }

    # Публичный API сайта (ruai-api). Лимиты здесь — первый рубеж; точные правила считает сервер.
    # Вход, регистрация, сброс и смена пароля: подбор режется здесь, точные правила считает сервер.
    # Только точные (=) локации: при совпадении с ^~ /api/ regex-локации nginx не проверяет.
    location = /api/auth/login {
        limit_req  zone=ruai_api_code burst=5 nodelay;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/ruai-proxy.conf;
    }
    location = /api/auth/register {
        limit_req  zone=ruai_api_code burst=5 nodelay;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/ruai-proxy.conf;
    }
    location = /api/auth/reset {
        limit_req  zone=ruai_api_code burst=5 nodelay;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/ruai-proxy.conf;
    }
    location = /api/auth/reset/confirm {
        limit_req  zone=ruai_api_code burst=5 nodelay;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/ruai-proxy.conf;
    }
    location = /api/auth/password {
        limit_req  zone=ruai_api_code burst=5 nodelay;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/ruai-proxy.conf;
    }
    # опрос подтверждения входа: раз в 2 секунды
    location = /api/auth/challenge {
        limit_req  zone=ruai_api_check burst=10 nodelay;
        client_max_body_size 1k;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/ruai-proxy.conf;
    }
    # ответ модели — поток SSE: без буферизации, долгий таймаут
    location = /api/chats/messages {
        limit_req  zone=ruai_api_send burst=5 nodelay;
        limit_conn ruai_api_conn 4;
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/ruai-proxy.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 200s;
    }
    location = /api/uploads {
        limit_req  zone=ruai_api_send burst=10 nodelay;
        client_max_body_size 11m;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/ruai-proxy.conf;
        proxy_read_timeout 90s;
    }
    # ^~ /api/ ниже отключает regex-ловушки — ловушку /api/admin повторяем явно
    location ^~ /api/admin {
        access_log /var/log/nginx/ruai-probe.log;
        return 404;
    }
    location ^~ /api/ {
        limit_req  zone=ruai_api burst=40 nodelay;
        limit_conn ruai_api_conn 20;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/ruai-proxy.conf;
    }

    # Админка: секретный путь, неизвестный снаружи.
    include /etc/nginx/snippets/ruai-admin.conf;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/ruai-security-headers.conf;
        try_files $uri =404;
    }

    # Чат: одна оболочка с noindex на все его адреса.
    location = /chat { try_files /chat/index.html =404; }
    location ^~ /chat/ { try_files $uri /chat/index.html; }
    # Оформление /checkout/<тариф>: оболочка с noindex; /checkout без тарифа страницы не имеет.
    location = /checkout { return 404; }
    location ^~ /checkout/ { try_files /checkout/index.html =404; }

    # Пререндер (dist/<страница>/index.html, у служебных /account, /reset, /payment/result - оболочки с noindex).
    # Адрес со слэшем на конце - 301 на адрес без слэша (canonical без слэша, дублей нет);
    # в редирект попадают только простые пути, без управляющих символов.
    # Остальное - 404; неверный «секретный» путь выглядит так же, как любой несуществующий адрес.
    location / {
        rewrite ^(/[A-Za-z0-9/_.-]+)/$ $1 permanent;
        try_files $uri $uri/index.html =404;
    }
}
